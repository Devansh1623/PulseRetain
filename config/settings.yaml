project:
  name: "PulseRetain"
  version: "1.0.0"
  random_seed: 42
  description: "SaaS Subscriber Attrition Intelligence Platform"

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  external: "data/external"
  models: "models/artifacts"
  sql: "sql"
  reports: "reports"

data:
  synthetic:
    n_subscribers: 8500
    start_date: "2022-01-01"
    end_date: "2024-12-31"
    seed: 42

pipeline:
  validation:
    monthly_fee_min: 9.99
    monthly_fee_max: 999.99
    contract_months_min: 1
    contract_months_max: 36
    seats_min: 1
    seats_max: 500
    allowed_plans: ["starter", "growth", "professional", "enterprise"]
    allowed_billing_cycles: ["monthly", "annual"]
    allowed_regions: ["APAC", "EMEA", "LATAM", "NAM"]
    allowed_acquisition_channels: ["organic", "paid_search", "referral", "partner", "direct_sales", "trial_convert"]
  cleaning:
    impute_numeric_strategy: "median"
    impute_categorical_strategy: "mode"
    cap_outliers_iqr_factor: 3.0
    dedup_key: "subscriber_id"

features:
  rolling_windows: [30, 60, 90]
  lag_periods: [1, 3, 6]

model:
  test_size: 0.20
  val_size: 0.15
  stratify: true
  cv_folds: 5
  scoring: "roc_auc"
  threshold: 0.40  # lower threshold = higher recall, better for retention campaigns

  logistic:
    C: [0.01, 0.1, 1.0, 10.0]
    max_iter: 1000

  random_forest:
    n_estimators: [200, 400]
    max_depth: [6, 10, null]
    min_samples_leaf: [2, 4]

  gradient_boost:
    n_estimators: [200, 400]
    max_depth: [4, 6]
    learning_rate: [0.05, 0.10]
    subsample: [0.8, 1.0]

  neural_net:
    epochs: 80
    batch_size: 256
    patience: 12
    embedding_dim: 8
    hidden_units: [128, 64, 32]
    dropout_rate: 0.30
    learning_rate: 0.001

dashboard:
  host: "0.0.0.0"
  port: 8501
  theme: "dark"
  page_title: "PulseRetain — SaaS Attrition Intelligence"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/pulse.log"
